{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        RepairTrack
        {% endblock %}
    </title>

    <!-- Main CSS -->
    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >

    <!-- Page-specific CSS -->
    {% block extra_css %}
    {% endblock %}

</head>

<body>

    {% if messages %}

        <div class="messages">

            {% for message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}

        </div>

    {% endif %}


    {% block content %}
    {% endblock %}

</body>

</html>
